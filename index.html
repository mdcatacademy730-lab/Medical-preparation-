};

function showHome(){document.getElementById("home").classList.remove("hidden");document.getElementById("subjects").classList.add("hidden");document.getElementById("quiz").classList.add("hidden");}
function showSubjects(cat){curCat=cat;document.getElementById("home").classList.add("hidden");document.getElementById("subjects").classList.remove("hidden");document.getElementById("subTitle").innerText=(cat==="mdcat"?"MDCAT - Hard":"Paramedics - Hard");var list=DATA[cat];var h="";for(var i=0;i<list.length;i++){h+='<div class="card" data-idx="'+i+'"><h2>'+list[i].name+'</h2><p>'+list[i].qs.length+' MCQs - Tap to Start</p></div>';}document.getElementById("subList").innerHTML=h;var cards=document.getElementById("subList").getElementsByClassName("card");for(var j=0;j<cards.length;j++){cards[j].onclick=(function(ii){return function(){startQuiz(ii);};})(j);}}
function startQuiz(idx){curIdx=idx;qIdx=0;score=0;document.getElementById("subjects").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");document.getElementById("quizTitle").innerText=DATA[curCat][curIdx].name;showQ();}
function showQ(){var list=DATA[curCat][curIdx].qs;var q=list[qIdx];document.getElementById("score").innerText="Score: "+score+" / "+list.length;document.getElementById("prog").style.width=(qIdx/list.length*100)+"%";var h='<div class="card"><b>Q'+(qIdx+1)+'. '+q.q+'</b>';for(var i=0;i<q.o.length;i++){h+='<div class="opt" data-opt="'+i+'">'+q.o[i]+'</div>';}h+='<div class="explain" id="exp"><b>Explanation:</b> '+q.e+'</div></div>';document.getElementById("qBox").innerHTML=h;var opts=document.getElementById("qBox").getElementsByClassName("opt");for(var k=0;k<opts.length;k++){opts[k].onclick=(function(el,ii){return function(){checkAns(el,ii,q.a);};})(opts[k],k);}}
function checkAns(el,ii,ans){var opts=document.getElementById("qBox").getElementsByClassName("opt");for(var i=0;i<opts.length;i++){opts[i].style.pointerEvents="none";}if(ii===ans){el.classList.add("correct");score++;document.getElementById("score").innerText="Score: "+score;}else{el.classList.add("wrong");opts[ans].classList.add("correct");}document.getElementById("exp").style.display="block";}
function nextQ(){var list=DATA[curCat][curIdx].qs;if(qIdx<list.length-1){qIdx++;showQ();}else{alert("Test Finished! Score: "+score+" / "+list.length);showHome();}}
document.getElementById("btnMdcat").onclick=function(){showSubjects("mdcat");};
document.getElementById("btnPara").onclick=function(){showSubjects("para");};
document.getElementById("back1").onclick=function(){showHome();};
document.getElementById("nextBtn").onclick=function(){nextQ();};
document.getElementById("homeBtn").onclick=function(){showHome();};
</script>
</body>
